services:
  # Flask API
  - type: web
    name: finance-tracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn finance_app:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false   # Neon connection string
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false   # for /chat, /parse-expense, /scan-receipt
      - key: FRONTEND_URL
        sync: false   # set to the static site URL for CORS

  # React frontend
  - type: web
    name: finance-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false   # set to the API service URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
